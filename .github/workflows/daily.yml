name: Günlük iş

# Rollup + retention temizliği + flag tespiti + skor. Günde bir kez,
# Türkiye saatiyle 04:10 (UTC 01:10) — gece dibinde, trafiği rahatsız etmez.
on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bilerek 'npm ci' degil.
      # Kilit dosyasi Windows'ta uretiliyor ve wasm yerel bindingleri
      # (@emnapi/*, @img/sharp-wasm32) platforma gore farkli cozumlendigi icin
      # 'npm ci' Linux'ta "kilit dosyasi senkron degil" deyip hic baslamiyor.
      # Bu isler yardimci is; sitenin uretim derlemesini Vercel kilit dosyasiyla
      # yapiyor, yani belirlenimlilik orada korunuyor.
      - run: npm install --no-audit --no-fund --omit=optional

      - name: Rollup, retention, flag, skor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run daily
