name: Günlük iş

# Rollup + retention temizliği + flag tespiti + skor. Günde bir kez,
# Türkiye saatiyle 04:10 (UTC 01:10) — gece dibinde, trafiği rahatsız etmez.
on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rollup, retention, flag, skor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run daily
