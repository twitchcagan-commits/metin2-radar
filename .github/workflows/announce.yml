name: Açılış duyurusu

# Saatlik. Açılışa 30 dakikadan az kalan sunucular için Discord webhook'una
# embed gönderir. Gönderim veritabanına yazılır, aynı duyuru iki kez gitmez.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bilerek 'npm ci' degil.
      # Kilit dosyasi Windows'ta uretiliyor ve wasm yerel bindingleri
      # (@emnapi/*, @img/sharp-wasm32) platforma gore farkli cozumlendigi icin
      # 'npm ci' Linux'ta "kilit dosyasi senkron degil" deyip hic baslamiyor.
      # Bu isler yardimci is; sitenin uretim derlemesini Vercel kilit dosyasiyla
      # yapiyor, yani belirlenimlilik orada korunuyor.
      - run: npm install --no-audit --no-fund --omit=optional

      - name: Yaklaşan açılışları duyur
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_ANNOUNCE_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run announce
