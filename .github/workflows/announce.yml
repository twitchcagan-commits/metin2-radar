name: Açılış duyurusu

# Saatlik. Açılışa 30 dakikadan az kalan sunucular için Discord webhook'una
# embed gönderir. Gönderim veritabanına yazılır, aynı duyuru iki kez gitmez.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Istege bagli yerel paketler (wasm/sharp bindingleri) platforma gore
      # farkli cozumlendigi icin kilit dosyasiyla catisabiliyor. Bu isler
      # tsx + supabase + cheerio disinda hicbir sey kullanmiyor, kurmuyoruz.
      - run: npm ci --omit=optional

      - name: Yaklaşan açılışları duyur
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_ANNOUNCE_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run announce
