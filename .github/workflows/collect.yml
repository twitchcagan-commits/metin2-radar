name: Toplayıcı

# 10 dakikada bir ölçüm. Vercel cron KULLANILMAZ (Hobby'de günde 1 kez çalışır).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Üst üste binmesin: koşan job varken yenisi beklemeden atlanır.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Istege bagli yerel paketler (wasm/sharp bindingleri) platforma gore
      # farkli cozumlendigi icin kilit dosyasiyla catisabiliyor. Bu isler
      # tsx + supabase + cheerio disinda hicbir sey kullanmiyor, kurmuyoruz.
      - run: npm ci --omit=optional

      - name: Ölçümleri topla
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run collect:once
