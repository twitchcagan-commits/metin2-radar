name: Toplayıcı

# 10 dakikada bir ölçüm. Vercel cron KULLANILMAZ (Hobby'de günde 1 kez çalışır).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Üst üste binmesin: koşan job varken yenisi beklemeden atlanır.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bilerek 'npm ci' degil.
      # Kilit dosyasi Windows'ta uretiliyor ve wasm yerel bindingleri
      # (@emnapi/*, @img/sharp-wasm32) platforma gore farkli cozumlendigi icin
      # 'npm ci' Linux'ta "kilit dosyasi senkron degil" deyip hic baslamiyor.
      # Bu isler yardimci is; sitenin uretim derlemesini Vercel kilit dosyasiyla
      # yapiyor, yani belirlenimlilik orada korunuyor.
      - run: npm install --no-audit --no-fund --omit=optional

      - name: Ölçümleri topla
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run collect:once
